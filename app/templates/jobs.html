{% extends "base.html" %}
{% block title %}Jobs | AI JobMatch{% endblock %}
{% block content %}
<section class="page-heading"><p class="eyebrow">LIVE JOB OPPORTUNITIES</p><h1>Find your next opportunity.</h1><p>Choose a city, job type and work mode to search live listings from multiple job sources.</p></section>
<section class="job-filters">
<div class="filter-group"><label for="filter-location">City or location</label><input id="filter-location" type="text" placeholder="e.g. Lahore or Remote"></div>
<div class="filter-group"><label for="filter-job-type">Job Type</label><select id="filter-job-type"><option value="">All job types</option><option value="Internship">Internship</option><option value="Full-time">Full-time</option><option value="Part-time">Part-time</option></select></div>
<div class="filter-group"><label for="filter-work-mode">Work Mode</label><select id="filter-work-mode"><option value="">All work modes</option><option value="Remote">Remote</option><option value="Hybrid">Hybrid</option><option value="On-site">On-site</option></select></div>
<button id="filter-jobs" class="btn form-button" type="button">Search Live Jobs</button></section>
<section id="jobs-list" class="jobs-grid" aria-live="polite"><p>Loading live jobs...</p></section>
<script>
const jobsList=document.getElementById("jobs-list"),locationInput=document.getElementById("filter-location"),jobTypeSelect=document.getElementById("filter-job-type"),workModeSelect=document.getElementById("filter-work-mode"),filterButton=document.getElementById("filter-jobs");
function esc(value){const d=document.createElement("div");d.textContent=value==null?"":String(value);return d.innerHTML;}
function card(job){const url=job.apply_url||"#";return "<article class=\"job-card\"><div class=\"job-card-top\"><div><h2>"+esc(job.title)+"</h2><p class=\"company-name\">"+esc(job.company)+"</p></div><span class=\"work-mode\">"+esc(job.work_mode)+"</span></div><p class=\"job-meta\">"+esc(job.location||"Location not specified")+" · "+esc(job.job_type||"Not specified")+"</p><p class=\"job-description\">"+esc((job.description||"No description available.").slice(0,500))+"</p><p class=\"skills-text\"><strong>Source:</strong> "+esc(job.source||"Job search")+"</p>"+(url!=="#"?"<a class=\"btn btn-primary\" href=\""+esc(url)+"\" target=\"_blank\" rel=\"noopener noreferrer\">Apply Now</a>":"")+"</article>";}
async function loadJobs(){filterButton.disabled=true;jobsList.innerHTML="<p>Searching live job listings...</p>";const q=new URLSearchParams();if(locationInput.value.trim())q.set("location",locationInput.value.trim());if(jobTypeSelect.value)q.set("job_type",jobTypeSelect.value);if(workModeSelect.value)q.set("work_mode",workModeSelect.value);try{const r=await fetch("/jobs/search-live?"+q.toString()),data=await r.json();if(!r.ok)throw Error(data.detail||"Could not load live jobs.");jobsList.innerHTML=data.length?data.map(card).join(""):"<p>No live jobs found for these filters. Try a broader search.</p>";}catch(e){jobsList.innerHTML="<p class=\"error-message\">"+esc(e.message)+"</p>";}finally{filterButton.disabled=false;}}
filterButton.addEventListener("click",loadJobs);locationInput.addEventListener("keydown",e=>{if(e.key==="Enter")loadJobs();});loadJobs();
</script>
{% endblock %}

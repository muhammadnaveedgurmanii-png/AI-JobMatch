{% extends "base.html" %}
{% block title %}Resume Profile | AI JobMatch{% endblock %}
{% block content %}
<section class="page-heading"><p class="eyebrow">RESUME PROFILE</p><h1>Tell us about your professional profile.</h1><p>Add your details once. AI JobMatch will use them to find relevant jobs.</p></section>
<section class="form-card"><form id="resume-form" novalidate>
<div class="form-grid">
<div class="form-group"><label for="full_name">Full Name</label><input id="full_name" name="full_name" type="text" placeholder="Your full name" minlength="2" maxlength="100" required></div>
<div class="form-group"><label for="email">Email Address</label><input id="email" name="email" type="email" placeholder="you@example.com" required></div>
<div class="form-group"><label for="location">Preferred Location</label><input id="location" name="location" type="text" placeholder="e.g. Lahore" maxlength="100"></div>
<div class="form-group"><label for="education">Education</label><input id="education" name="education" type="text" placeholder="e.g. BS Computer Science" maxlength="5000"></div>
</div>
<div class="form-group"><label for="summary">Professional Summary</label><textarea id="summary" name="summary" maxlength="10000" placeholder="Write a short summary about your goals and experience."></textarea></div>
<div class="form-group"><label for="skills">Skills</label><textarea id="skills" name="skills" maxlength="5000" placeholder="e.g. Python, FastAPI, SQL, Machine Learning"></textarea></div>
<div class="form-group"><label for="experience">Experience</label><textarea id="experience" name="experience" maxlength="10000" placeholder="Briefly describe projects, internships, or work experience."></textarea></div>
<div class="form-group"><label for="resume-file">Upload Resume PDF (optional, max 5 MB)</label><input id="resume-file" name="resume-file" type="file" accept=".pdf,application/pdf"></div>
<button id="save-profile" class="btn btn-primary form-button" type="submit">Save Resume Profile</button><p id="form-message" aria-live="polite"></p>
</form></section>
<script>
const form=document.getElementById("resume-form"),message=document.getElementById("form-message"),fileInput=document.getElementById("resume-file"),button=document.getElementById("save-profile");
function showMessage(text,success){message.textContent=text;message.className=success?"success-message":"error-message";}
async function readJson(response){const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.detail||"Something went wrong.");return data;}
form.addEventListener("submit",async event=>{event.preventDefault();if(!form.reportValidity())return;button.disabled=true;showMessage("Saving your profile...",true);try{const user=await readJson(await fetch("/users/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({full_name:document.getElementById("full_name").value.trim(),email:document.getElementById("email").value.trim(),preferred_location:document.getElementById("location").value.trim()})}));const profile=await readJson(await fetch("/resumes/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user_id:user.id,professional_summary:document.getElementById("summary").value.trim(),skills:document.getElementById("skills").value.trim(),education:document.getElementById("education").value.trim(),experience:document.getElementById("experience").value.trim()})}));localStorage.setItem("ai_jobmatch_user_id",String(user.id));if(fileInput.files[0]){showMessage("Profile saved. Uploading your resume...",true);const data=new FormData();data.append("user_id",user.id);data.append("file",fileInput.files[0]);await readJson(await fetch("/resumes/upload",{method:"POST",body:data}));}showMessage("Your profile and resume were saved successfully.",true);}catch(error){showMessage(error.message,false);}finally{button.disabled=false;}});
</script>
{% endblock %}

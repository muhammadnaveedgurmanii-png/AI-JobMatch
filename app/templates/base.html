<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI JobMatch{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >
</head>
<body>
    <header class="navbar">
        <a class="logo" href="/">AI JobMatch</a>

        <nav class="nav-links">
            <a href="/">Home</a>
            <a href="/resume">Resume</a>
            <a href="/jobs-page">Jobs</a>
            <a href="/matches-page">Matched Jobs</a>
            <a href="/about">About</a>
        </nav>
    </header>

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>© 2026 AI JobMatch — Find work that fits your skills.</p>
    </footer>
</body>
</html>
